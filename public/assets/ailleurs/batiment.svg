<!-- PROVISOIRE. Ce grain est dessiné ici parce que `fabriquerPiece`
     (src/scene/poses.ts) aplatit la masse au noir du fond au lieu de la
     tramer : sans ces points, le mur serait le seul trou noir de l'écran.
     Le jour où la couche de décor produit son propre grain, retirer
     celui-ci — mur et carreaux — sinon le mur sera grainé deux fois.
     Il dépend aussi de la résolution : sous un `parCadre` d'environ 0,6,
     les points tombent sous SEUIL_TRAIT et le mur s'éteint. -->
<path stroke-dasharray="0 19 0 27" d="M616 124 H705 M815 124 H904 M560 148 H713 M807 148 H960 M504 172 H1016"/>
<path stroke-dasharray="0 13 0 19" d="M10 192 H1030 M17 210 H1030 M13 228 H1030 M21 246 H1030 M15 264 H1030 M10 282 H1030"/>
<path stroke-dasharray="0 9 0 12 0 15" d="M10 302 H556 M684 302 H1030 M17 317 H556 M691 317 H1030 M13 332 H556 M687 332 H1030 M21 347 H556 M695 347 H1030 M15 362 H556 M689 362 H1030 M10 377 H556 M684 377 H1030 M17 392 H556 M691 392 H1030 M13 407 H556 M687 407 H1030 M21 422 H556 M695 422 H1030 M15 437 H556 M689 437 H1030 M10 452 H556 M684 452 H1030 M17 467 H556 M691 467 H1030 M13 482 H556 M687 482 H1030"/>
<!-- Pas d'horloge ici : ni cadran, ni graduations, ni halo, ni aiguilles.
     L'horloge est une des quatre lumières de la gare, et ce dessin s'éteint
     avec le mur : `QuaiLayer.ts` la trace tout entière dans la racine
     allumée (disque, graduations, halo en cellules de grain, aiguilles à la
     vraie heure, `anglesHorloge`). La garder ici en ferait un second cadran,
     éteint, sous le premier — le même piège que le double grain ci-dessus.
     Son centre et son rayon (`HORLOGE_SVG`, src/scene/quai.ts) restent
     ceux du pignon : la place est réservée, vide. -->
<path d="M565 499.25 V350 A55 55 0 0 1 675 350 V499.25"/>
<path d="M565 350 H675"/>
<path d="M620 350 L572.4 322.5 M620 350 L667.6 322.5"/>
